networks:
    default:
        name: court-1

services:
    mysql:
        container_name: court-1-mysql
        image: mysql:8.4.8
        ports:
            - 3306:3306
        volumes:
            - ../data/mysql:/var/lib/mysql
        command:
            [
                "--character-set-server=utf8mb4",
                "--collation-server=utf8mb4_general_ci"
            ]
        restart: always
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
            interval: 60s
            timeout: 15s
            retries: 3
            start_interval: 15s
            start_period: 60s
        environment:
            MYSQL_ROOT_PASSWORD: "Court-1.Root@123"
            MYSQL_DATABASE: "court_1"

    redis:
        container_name: court-1-redis
        image: redis:8.4.0
        ports:
            - 6379:6379
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
            interval: 60s
            timeout: 15s
            retries: 3
            start_interval: 15s
            start_period: 60s

    directus:
        container_name: court-1-directus
        image: directus/directus:11.14.1
        ports:
            - 8055:8055
        volumes:
            - ../data/directus/extensions:/directus/extensions
            - ../data/directus/templates:/directus/templates
            - ../data/directus/uploads:/directus/uploads
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: always
        environment:
            SECRET: "SECRET-ABC-XYZ-123-END"
            DB_CLIENT: "mysql"
            DB_HOST: "mysql"
            DB_PORT: 3306
            DB_USER: "root"
            DB_PASSWORD: "Court-1.Root@123"
            DB_DATABASE: "court_1"
            CACHE_ENABLED: true
            CACHE_STORE: "redis"
            CACHE_AUTO_PURGE: true
            REDIS_HOST: "redis"
            REDIS_PORT: 6379
            SESSION_COOKIE_SECURE: true
            ADMIN_EMAIL: "admin@example.com"
            ADMIN_PASSWORD: "Court-1.Admin@123"
            WEBSOCKETS_ENABLED: true
            PUBLIC_URL: "https://cuddly-trout-4jv547pr97v43qgx-8055.app.github.dev"

    next:
        container_name: court-1-next
        build:
            context: ../source
            dockerfile: next.dev.dockerfile
        ports:
            - 3000:3000
        volumes:
            - ../source/src:/next/src
        depends_on:
            - directus
        restart: always
        environment:
            ENCRYPTION_KEY: "SECRET-ABC-XYZ-123-ENCRYPTION"
            COOKIE_ACCESS_TOKEN: "court_access_token"
            COOKIE_LANGUAGE_LOCALE: "court_language_locale"
            COOKIE_SIDEBAR_EXPANDED: "court_sidebar_expanded"
            DATA_URL: "http://directus:8055"
            NEXT_PUBLIC_DATA_URL: "https://cuddly-trout-4jv547pr97v43qgx-8055.app.github.dev"